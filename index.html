<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111">
<title>My Workout Tracker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f7;
  color:#171717;
  padding-bottom:40px;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:30px 18px;
}

header h1{
  font-size:28px;
  margin-bottom:7px;
}

header p{
  color:#ccc;
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px 14px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:15px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:14px 7px;
  text-align:center;
  box-shadow:0 3px 12px #0000000b;
}

.stat b{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.stat span{
  font-size:11px;
  color:#707070;
}

.progress-card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #0000000b;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:bold;
}

.progress-track{
  height:10px;
  background:#e7e7e7;
  border-radius:99px;
  margin-top:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:#111;
  border-radius:99px;
  transition:.25s;
}

.day{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 14px #0000000b;
}

.day-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}

.day-head h2{
  font-size:18px;
}

.tag{
  background:#111;
  color:white;
  border-radius:99px;
  padding:5px 8px;
  font-size:10px;
  white-space:nowrap;
}

.focus{
  font-size:12px;
  color:#707070;
  margin-bottom:12px;
}

.exercise{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 3px;
  border-bottom:1px solid #e9e9e9;
}

.exercise:last-of-type{
  border-bottom:0;
}

.exercise input{
  width:21px;
  height:21px;
  accent-color:#111;
  flex:none;
}

.exercise label{
  flex:1;
  font-size:14px;
  cursor:pointer;
}

.exercise small{
  display:block;
  color:#707070;
  font-size:11px;
  margin-top:3px;
}

.exercise.done label{
  text-decoration:line-through;
  opacity:.48;
}

.info{
  background:#f0f0f0;
  border-radius:12px;
  padding:11px 12px;
  font-size:12px;
  line-height:1.55;
  margin-top:12px;
}

.morning{
  border-left:4px solid #111;
}

.rest{
  text-align:center;
  padding:28px 15px;
}

.rest
