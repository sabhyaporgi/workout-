<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Fat Loss Workout</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f7;
  color: #222;
  padding-bottom: 40px;
}

header {
  background: #111;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

header p {
  color: #ccc;
  font-size: 14px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: white;
  border-radius: 15px;
  padding: 16px 8px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.stat strong {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

.stat span {
  font-size: 12px;
  color: #777;
}

.progress-box {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.progress-bar {
  height: 12px;
  background: #e5e5e5;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #111;
  transition: .3s;
}

.day {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 14px rgba(0,0,0,.07);
}

.day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.day-header h2 {
  font-size: 19px;
}

.tag {
  font-size: 11px;
  background: #111;
  color: white;
  padding: 6px 9px;
  border-radius: 20px;
}

.focus {
  color: #777;
  font-size: 13px;
  margin-bottom: 15px;
}

.exercise {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 5px;
  border-bottom: 1px solid #eee;
}

.exercise:last-child {
  border-bottom: none;
}
